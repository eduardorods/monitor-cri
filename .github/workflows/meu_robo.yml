name: Consulta CRI (B3)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "O que fazer"
        required: true
        type: choice
        default: buscar
        options:
          - buscar
          - listar-securitizadoras
          - listar-cris
      codigo_if:
        description: "Código IF (só no modo 'buscar')"
        required: false
        type: string
      cnpj_securitizadora:
        description: "CNPJ securitizadora, só dígitos (exige no 'listar-cris')"
        required: false
        type: string
      limite:
        description: "Máx de itens no modo listar (0 = todos)"
        required: false
        type: string
        default: "0"
      sem_documentos:
        description: "Pular documentos FNet (modo buscar)"
        required: false
        type: boolean
        default: false

jobs:
  consulta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar
        run: |
          case "${{ inputs.modo }}" in
            buscar)
              ARGS="--codigo-if ${{ inputs.codigo_if }} --saida resultado.xlsx --baixar-pdfs pdfs"
              [ -n "${{ inputs.cnpj_securitizadora }}" ] && ARGS="$ARGS --cnpj-securitizadora ${{ inputs.cnpj_securitizadora }}"
              [ "${{ inputs.sem_documentos }}" = "true" ] && ARGS="$ARGS --sem-documentos"
              ;;
            listar-securitizadoras)
              ARGS="--listar-securitizadoras --saida resultado.xlsx"
              ;;
            listar-cris)
              ARGS="--listar-cris --cnpj-securitizadora ${{ inputs.cnpj_securitizadora }} --limite ${{ inputs.limite }} --saida resultado.xlsx"
              ;;
          esac
          echo "Executando: python main.py $ARGS"
          python main.py $ARGS

      - name: Mostrar resumo no log
        if: always()
        run: |
          if [ -f resultado.xlsx ]; then
            python print_xlsx.py resultado.xlsx
          else
            echo "resultado.xlsx não gerado."
          fi

      - name: Enviar para Google Drive
        if: always()
        env:
          CODIGO_IF: ${{ inputs.codigo_if }}
          MODO: ${{ inputs.modo }}
        run: |
          if [ ! -f resultado.xlsx ]; then
            echo "Sem arquivo para enviar."
            exit 0
          fi
          if [ "$MODO" = "buscar" ] && [ -n "$CODIGO_IF" ]; then
            SUBPASTA="CRIs/$CODIGO_IF"
            # PDFs do FNet (não inclui manuais baixados do Drive — esses não
            # precisam voltar): nomes determinísticos 'fnet*' garantem dedupe.
            PDFS=()
            if [ -d "pdfs/$CODIGO_IF" ]; then
              while IFS= read -r -d '' f; do
                PDFS+=("$f")
              done < <(find "pdfs/$CODIGO_IF" -maxdepth 1 -type f \( -name "fnet*.pdf" -o -name "i[0-9][0-9][0-9]_*.pdf" \) -print0)
            fi
            if [ ${#PDFS[@]} -gt 0 ]; then
              echo "Subindo ${#PDFS[@]} PDF(s) (skip-existing)..."
              python upload_drive.py --subpasta "$SUBPASTA" --skip-existing "${PDFS[@]}"
            fi
            # resultado.xlsx sempre atualiza (overwrite), nunca duplica.
            python upload_drive.py --subpasta "$SUBPASTA" --replace-existing resultado.xlsx
          else
            python upload_drive.py --subpasta "CRIs" --replace-existing resultado.xlsx
          fi

      - name: Upload do artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ inputs.modo }}
          path: |
            resultado.xlsx
            pdfs/**
          retention-days: 7
          if-no-files-found: warn
