name: Monitor Vórtx Excel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Dependências
        run: |
          pip install selenium pandas openpyxl

      - name: Rodar Script de Extração
        run: python main.py

      - name: Upload do Arquivo Excel
        uses: actions/upload-artifact@v4
        with:
          name: Relatorio_CRI
          path: |
            dados_cri_vortx.xlsx
            *.png
          retention-days: 5
