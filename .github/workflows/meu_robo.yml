name: Consulta CRI (B3)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "O que fazer"
        required: true
        type: choice
        default: buscar
        options:
          - buscar
          - listar-securitizadoras
          - listar-cris
      codigo_if:
        description: "Código IF (só no modo 'buscar')"
        required: false
        type: string
      cnpj_securitizadora:
        description: "CNPJ securitizadora, só dígitos (exige no 'listar-cris')"
        required: false
        type: string
      limite:
        description: "Máx de itens no modo listar (0 = todos)"
        required: false
        type: string
        default: "0"
      sem_documentos:
        description: "Pular documentos FNet (modo buscar)"
        required: false
        type: boolean
        default: false

jobs:
  consulta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # necessário para Workload Identity Federation

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar
        run: |
          case "${{ inputs.modo }}" in
            buscar)
              ARGS="--codigo-if ${{ inputs.codigo_if }} --saida resultado.xlsx --baixar-pdfs pdfs"
              [ -n "${{ inputs.cnpj_securitizadora }}" ] && ARGS="$ARGS --cnpj-securitizadora ${{ inputs.cnpj_securitizadora }}"
              [ "${{ inputs.sem_documentos }}" = "true" ] && ARGS="$ARGS --sem-documentos"
              ;;
            listar-securitizadoras)
              ARGS="--listar-securitizadoras --saida resultado.xlsx"
              ;;
            listar-cris)
              ARGS="--listar-cris --cnpj-securitizadora ${{ inputs.cnpj_securitizadora }} --limite ${{ inputs.limite }} --saida resultado.xlsx"
              ;;
          esac
          echo "Executando: python main.py $ARGS"
          python main.py $ARGS

      - name: Mostrar resumo no log
        if: always()
        run: |
          if [ -f resultado.xlsx ]; then
            python print_xlsx.py resultado.xlsx
          else
            echo "resultado.xlsx não gerado."
          fi

      - name: Autenticar no Google Cloud (Workload Identity Federation)
        if: always()
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Enviar para Google Drive
        if: always()
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          CODIGO_IF: ${{ inputs.codigo_if }}
          MODO: ${{ inputs.modo }}
        run: |
          if [ ! -f resultado.xlsx ]; then
            echo "Sem arquivo para enviar."
            exit 0
          fi
          if [ "$MODO" = "buscar" ] && [ -n "$CODIGO_IF" ]; then
            SUBPASTA="CRIs/$CODIGO_IF"
            ARQUIVOS=("resultado.xlsx")
            if [ -d "pdfs/$CODIGO_IF" ]; then
              while IFS= read -r -d '' f; do ARQUIVOS+=("$f"); done < <(find "pdfs/$CODIGO_IF" -type f -print0)
            fi
            python upload_drive.py --subpasta "$SUBPASTA" "${ARQUIVOS[@]}"
          else
            python upload_drive.py --subpasta "CRIs" resultado.xlsx
          fi

      - name: Upload do artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ inputs.modo }}
          path: |
            resultado.xlsx
            pdfs/**
          retention-days: 7
          if-no-files-found: warn
